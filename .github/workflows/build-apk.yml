name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache libffi-dev libssl-dev \
            zlib1g-dev openjdk-17-jdk unzip zip autoconf libtool \
            pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake lld clang \
            patch gettext libltdl-dev
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" "buildozer>=1.5.0"

      - name: Construir APK con Buildozer
        run: |
          if [ -f "buildozer.spec" ]; then
            DIR="."
          elif [ -f "LM_Android/buildozer.spec" ]; then
            DIR="LM_Android"
          else
            DIR=$(find . -name "buildozer.spec" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$DIR" ]; then
            echo "Error: No se encontró buildozer.spec en el repositorio."
            exit 1
          fi

          cd "$DIR"
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          yes | buildozer android debug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: LM-Palabras-apk
          path: "**/bin/*.apk"
