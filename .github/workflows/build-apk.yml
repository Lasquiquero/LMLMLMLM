name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv setuptools

      - name: Construir el APK
        run: buildozer -v android debug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: LM-Palabras-apk
          path: bin/*.apk

      - name: Guardar el registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-buildozer
          path: .buildozer/logs/
          if-no-files-found: ignore
