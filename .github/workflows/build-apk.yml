name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache libffi-dev libssl-dev \
            zlib1g-dev openjdk-17-jdk unzip zip
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Construir APK con Buildozer
        run: |
          cd LM_Android
          buildozer android debug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: LM-Palabras-apk
          path: LM_Android/bin/*.apk
